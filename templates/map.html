{% extends "base.html" %}

{% block title %}Find Home Producers - Local Fare{% endblock %}

{% block head %}
<style>
/* Full screen layout styles - override main.css */
body.map-view .map-container {
    height: calc(100vh - var(--navbar-height));
    width: 100vw;
    background: white;
    display: flex;
    border-radius: 0;
    box-shadow: none;
    margin-bottom: 0;
}

.producer-panel {
    width: 400px;
    min-width: 300px;
    max-width: 500px;
    background: #f8f9fa;
    border-right: 1px solid #dee2e6;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.producer-list {
    flex: 1;
    overflow-y: auto;
    padding: 1rem;
}

.map-area {
    flex: 1;
    position: relative;
}

#map {
    height: 100%;
    width: 100%;
}


.producer-card {
    background: white;
    border: 1px solid #dee2e6;
    border-radius: 0.375rem;
    margin-bottom: 1rem;
    transition: all 0.2s ease;
}

.producer-card:hover {
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    transform: translateY(-1px);
}

.producer-card .card-body {
    padding: 1rem;
}

.producer-card .card-footer {
    padding: 0.75rem 1rem;
    background: #f8f9fa;
    border-top: 1px solid #dee2e6;
}

/* Mobile hamburger menu */
.mobile-menu-toggle {
    display: none;
    position: fixed;
    top: calc(var(--navbar-height) + 80px);
    left: 10px;
    width: 48px;
    z-index: 1;
    background: white;
    border: 1px solid #dee2e6;
    border-radius: 0.375rem;
    padding: 0.5rem;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    cursor: pointer;
}

/* Mobile responsiveness */
@media (max-width: 768px) {
    .mobile-menu-toggle {
        display: block;
    }
    
    .producer-panel {
        position: fixed;
        top: var(--navbar-height);
        left: 0;
        width: 300px;
        height: calc(100vh - var(--navbar-height));
        z-index: 1050;
        transform: translateX(-100%);
        transition: transform 0.3s ease;
        box-shadow: 2px 0 8px rgba(0,0,0,0.1);
    }
    
    .producer-panel.show {
        transform: translateX(0);
    }
    
    .map-area {
        width: 100%;
    }
    
    .map-overlay {
        display: none;
        position: fixed;
        top: var(--navbar-height);
        left: 0;
        width: 100%;
        height: calc(100vh - var(--navbar-height));
        background: rgba(0,0,0,0.5);
        z-index: 1040;
    }
    
    .map-overlay.show {
        display: block;
    }
}

/* Full screen override for map view */
body.map-view {
    padding: 0 !important;
    margin: 0 !important;
    overflow: hidden;
}

body.map-view .container {
    max-width: none !important;
    padding: 0 !important;
    margin: 0 !important;
}

body.map-view main.container {
    padding: 0 !important;
    margin: 0 !important;
    max-width: none !important;
}

body.map-view .footer {
    display: none !important;
}
</style>
{% endblock %}

{% block content %}
<!-- Mobile Menu Toggle -->
<button class="mobile-menu-toggle" onclick="toggleMobileMenu()" aria-label="Toggle producer list">
    <i class="fas fa-bars"></i>
</button>

<!-- Mobile Overlay -->
<div class="map-overlay" onclick="closeMobileMenu()"></div>

<div class="map-container">
    <!-- Left Producer Panel -->
    <div class="producer-panel" id="producer-panel">
        <div class="producer-list">
            <div id="shop-list">
                <div class="text-center py-4">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-2 text-muted">Loading producers...</p>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Right Map Area -->
    <div class="map-area">
        <div id="map"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let map;
let markers = [];
let shops = [];

// Add map-view class to body for full screen styling
document.addEventListener('DOMContentLoaded', function() {
    document.body.classList.add('map-view');
});

function initMap() {
    // Default to a central location
    const defaultCenter = { lat: 39.8283, lng: -98.5795 }; // Center of US
    
    map = new google.maps.Map(document.getElementById('map'), {
        zoom: 10,
        center: defaultCenter,
        mapTypeControl: true,
        fullscreenControl: false,
        streetViewControl: false
    });
    
    // Try to get user's location
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function(position) {
            const userLocation = {
                lat: position.coords.latitude,
                lng: position.coords.longitude
            };
            map.setCenter(userLocation);
            
            // Add user location marker
            new google.maps.Marker({
                position: userLocation,
                map: map,
                title: 'Your Location',
                icon: {
                    url: 'https://maps.google.com/mapfiles/ms/icons/blue-dot.png'
                }
            });
        });
    }
    
    // Load shops from API
    loadShops();
}

function loadShops() {
    fetch('/api/shops')
        .then(response => response.json())
        .then(data => {
            shops = data;
            displayShopsOnMap();
            displayShopList();
        })
        .catch(error => {
            console.error('Error loading shops:', error);
            displayErrorMessage();
        });
}

function displayShopsOnMap() {
    // Clear existing markers
    markers.forEach(marker => marker.setMap(null));
    markers = [];
    
    shops.forEach(shop => {
        const marker = new google.maps.Marker({
            position: { lat: shop.latitude, lng: shop.longitude },
            map: map,
            title: shop.name,
            icon: {
                url: shop.is_open ? 
                    'https://maps.google.com/mapfiles/ms/icons/green-dot.png' :
                    'https://maps.google.com/mapfiles/ms/icons/red-dot.png'
            }
        });
        
        const infoWindow = new google.maps.InfoWindow({
            content: `
                <div style="max-width: 250px;">
                    <h6>${shop.name}</h6>
                    <p class="mb-1">${shop.address}</p>
                    <p class="mb-1">
                        <span class="badge ${shop.is_open ? 'bg-success' : 'bg-danger'}">
                            ${shop.is_open ? 'Open' : 'Closed'}
                        </span>
                    </p>
                    ${shop.rating > 0 ? `<p class="mb-1">Rating: ${shop.rating.toFixed(1)}/5</p>` : ''}
                    <a href="/shop/${shop.id}" class="btn btn-primary btn-sm">Visit Shop</a>
                </div>
            `
        });
        
        marker.addListener('click', () => {
            infoWindow.open(map, marker);
        });
        
        markers.push(marker);
    });
}

function displayShopList() {
    const shopList = document.getElementById('shop-list');
    
    if (shops.length === 0) {
        shopList.innerHTML = `
            <div class="text-center py-4">
                <i class="fas fa-store fa-2x text-muted mb-3"></i>
                <h6 class="text-muted">No producers found</h6>
                <p class="text-muted small">Be the first in your area!</p>
            </div>
        `;
        return;
    }
    
    const shopCards = shops.map(shop => `
        <div class="producer-card" onclick="centerMapOnShop(${shop.latitude}, ${shop.longitude})">
            <div class="card-body">
                <h6 class="card-title mb-2">
                    ${shop.name}
                    <span class="badge ${shop.is_open ? 'bg-success' : 'bg-danger'} float-end">
                        ${shop.is_open ? 'Open' : 'Closed'}
                    </span>
                </h6>
                <p class="card-text text-muted small mb-2">
                    <i class="fas fa-map-marker-alt me-1"></i>
                    ${shop.address}
                </p>
                ${shop.rating > 0 ? `
                    <p class="card-text mb-0">
                        <span class="text-warning small">
                            ${'★'.repeat(Math.floor(shop.rating))}${'☆'.repeat(5 - Math.floor(shop.rating))}
                        </span>
                        <small class="text-muted ms-1">${shop.rating.toFixed(1)}/5</small>
                    </p>
                ` : ''}
            </div>
            <div class="card-footer">
                <a href="/shop/${shop.id}" class="btn btn-primary btn-sm me-2" onclick="event.stopPropagation();">
                    <i class="fas fa-eye me-1"></i>Visit
                </a>
                <small class="text-muted">
                    <i class="fas fa-mouse-pointer me-1"></i>Click to center map
                </small>
            </div>
        </div>
    `).join('');
    
    shopList.innerHTML = shopCards;
}

function displayErrorMessage() {
    const shopList = document.getElementById('shop-list');
    shopList.innerHTML = `
        <div class="text-center py-4">
            <i class="fas fa-exclamation-triangle fa-2x text-warning mb-3"></i>
            <h6 class="text-muted">Unable to load producers</h6>
            <p class="text-muted small">Please refresh the page to try again.</p>
        </div>
    `;
}

function centerMapOnShop(lat, lng) {
    map.setCenter({ lat: lat, lng: lng });
    map.setZoom(15);
    
    // Highlight the marker briefly
    const marker = markers.find(m => 
        m.getPosition().lat() === lat && m.getPosition().lng() === lng
    );
    if (marker) {
        // Bounce the marker
        marker.setAnimation(google.maps.Animation.BOUNCE);
        setTimeout(() => marker.setAnimation(null), 2000);
    }
}

// Mobile menu functions
function toggleMobileMenu() {
    const panel = document.getElementById('producer-panel');
    const overlay = document.querySelector('.map-overlay');
    
    panel.classList.toggle('show');
    overlay.classList.toggle('show');
}

function closeMobileMenu() {
    const panel = document.getElementById('producer-panel');
    const overlay = document.querySelector('.map-overlay');
    
    panel.classList.remove('show');
    overlay.classList.remove('show');
}

// Initialize map when page loads
window.onload = function() {
    // Check if Google Maps API is available
    if (typeof google !== 'undefined') {
        initMap();
    } else {
        // Fallback for when Google Maps isn't available
        document.getElementById('map').innerHTML = `
            <div class="d-flex align-items-center justify-content-center h-100 bg-light">
                <div class="text-center">
                    <i class="fas fa-map fa-3x text-muted mb-3"></i>
                    <h5 class="text-muted">Map service unavailable</h5>
                    <p class="text-muted">Please check the producer list to find local sellers.</p>
                </div>
            </div>
        `;
        
        // Still load and display shops
        loadShops();
    }
};

// Clean up when leaving the page
window.addEventListener('beforeunload', function() {
    document.body.classList.remove('map-view');
});
</script>

<!-- Google Maps API -->
<script async defer src="https://maps.googleapis.com/maps/api/js?key={{ config.GOOGLE_MAPS_API_KEY or 'YOUR_API_KEY' }}&callback=initMap"></script>
{% endblock %}
